services:
  db:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    container_name: jeomji-db
    environment:
      POSTGRES_DB: jeomji
      POSTGRES_USER: jeomji
      POSTGRES_PASSWORD: jeomji
      # 한글 정렬·대소문자 처리를 위해 로케일 고정
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    ports:
      - "127.0.0.1:5434:5432"   # 이 컴퓨터에서만 열린다(비밀번호가 저장소에 공개돼 있으니 같은 와이파이 등 밖에서는 못 붙게) · 적재기(scripts/load_to_pg.py)·검증 안내의 기본값과 같다
    volumes:
      - jeomji-pgdata:/var/lib/postgresql/data
      - ../sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro   # 처음 기동할 때 스키마만 만든다 (검증은 적재 뒤에)
      - ../sql:/sql:ro       # 검증: docker compose exec -T db psql -U jeomji -d jeomji -f /sql/02_verify.sql
    shm_size: 1g             # 대용량 정렬·인덱스 빌드용
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=512MB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jeomji -d jeomji"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  jeomji-pgdata:
