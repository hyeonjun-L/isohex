# 웹 앱: 형 검사 → 단위 시험 → 빌드 → 브라우저 시험(데스크톱·폰) → 배포
# 배포는 main에 올렸을 때, 그리고 Cloudflare 비밀값 두 개가 저장소에 있을 때만 한다 (없으면 시험까지만).
name: ci

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      HAS_CF: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 패키지 설치
        run: npm ci

      - name: 형 검사
        run: npm run typecheck

      - name: 단위 시험
        run: npm test

      - name: 빌드
        run: npx vite build
        env:
          # 브이월드 배경지도 키 — 없으면 배경 없이 빌드된다
          VITE_VWORLD_KEY: ${{ secrets.VWORLD_KEY }}

      - name: 브라우저 시험 준비
        run: npx playwright install --with-deps chromium

      - name: 브라우저 시험 (데스크톱·폰)
        run: npm run e2e

      - name: 시험 기록 올리기 (실패했을 때만)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7

      - name: 배포 (Cloudflare Workers)
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.HAS_CF == 'true'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
