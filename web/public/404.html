<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light dark" />
    <title>없는 주소 — 점지</title>
    <style>
      :root { --bg: #f4f3ef; --fg: #1d1d1b; --muted: #5c5c57; --link: #1b4f8f; }
      @media (prefers-color-scheme: dark) { :root { --bg: #1d1d20; --fg: #ececec; --muted: #a2a2a8; --link: #86bdf2; } }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
        font-family: Pretendard, 'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', sans-serif; padding: 16px; }
      main { max-width: 420px; text-align: center; line-height: 1.6; }
      h1 { font-size: 22px; margin: 0 0 8px; }
      p { color: var(--muted); margin: 0 0 20px; }
      a { color: var(--link); font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>없는 주소입니다</h1>
      <p>주소가 바뀌었거나 잘못 적혔을 수 있어요.</p>
      <a href="/">점지 첫 화면으로</a>
    </main>
  </body>
</html>
